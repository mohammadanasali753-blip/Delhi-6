name: Build Ludo APKs
on:
  push:
    paths: ['ludo-apps/**']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ludo-apps
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle :ludo:assembleDebug :controller:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ludo-apks
          path: |
            ludo-apps/ludo/build/outputs/apk/debug/ludo-debug.apk
            ludo-apps/controller/build/outputs/apk/debug/controller-debug.apk
