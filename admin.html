<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Delhi 6 Hotel Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#fffaf0;color:#171717}header{background:#f4c400;padding:18px 6%;font-size:23px;font-weight:900}.wrap{max-width:1050px;margin:auto;padding:25px 5%}.panel{background:#fff;padding:20px;border-radius:16px;box-shadow:0 3px 15px #0002;margin-bottom:18px}input,textarea,select{width:100%;padding:11px;margin:6px 0;border:1px solid #ccc;border-radius:8px}button{padding:11px 15px;border:0;border-radius:9px;background:#f4c400;font-weight:900;cursor:pointer}.danger{background:#171717;color:#fff}.logout{float:right}.row{display:grid;grid-template-columns:1.3fr .7fr 1.3fr .8fr .7fr;gap:7px;border-top:1px solid #ddd;padding:12px 0;align-items:center}.order{border-top:1px solid #ddd;padding:15px 0}.status{padding:8px;border-radius:8px;font-weight:800}.small{font-size:13px;color:#666}@media(max-width:700px){.row{grid-template-columns:1fr}.logout{float:none;margin-top:10px;width:100%}}</style></head><body><header>🔐 Delhi 6 Hotel — Admin <button id="logoutBtn" class="logout" onclick="logout()" style="display:none">Logout</button></header><div class="wrap"><div id="login" class="panel"><h2>Admin Login</h2><input id="email" type="email" placeholder="Admin email"><input id="password" type="password" placeholder="Password"><button type="button" onclick="login()">Login</button><p class="small">Admin account Supabase Authentication me banana hoga.</p></div><div id="app" style="display:none"><div class="panel"><h2>Google Maps</h2><input id="mapurl" placeholder="Google Maps URL"><button onclick="saveMap()">Save Map</button></div><div class="panel"><h2>Add Menu Item</h2><input id="n" placeholder="Name"><input id="p" type="number" placeholder="Price ₹"><input id="img" placeholder="Image URL"><textarea id="desc" placeholder="Description"></textarea><button onclick="addItem()">Add Item</button></div><div class="panel"><h2>Menu Management</h2><div id="list">Loading...</div></div><div class="panel"><h2>Orders</h2><div id="orders">Loading...</div></div></div></div><script>const SB_URL="https://qxktximeddpttcjkaumo.supabase.co",SB_KEY="sb_publishable_mUL6OaOwJ649Xi68uQOcLw_9g0fM8mM",db=supabase.createClient(SB_URL,SB_KEY);function esc(v){return String(v??"").replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c])}function money(n){return "₹"+Number(n||0).toLocaleString("en-IN")}async function login(){
  const emailEl=document.getElementById("email");
  const passwordEl=document.getElementById("password");
  const btn=document.querySelector('#login button');
  const emailValue=emailEl.value.trim();
  const passwordValue=passwordEl.value;
  if(!emailValue||!passwordValue){alert('Email aur password dono bharo.');return}
  btn.disabled=true;btn.textContent='Logging in...';
  try{
    const r=await db.auth.signInWithPassword({email:emailValue,password:passwordValue});
    if(r.error){alert('Login failed: '+r.error.message);return}
    showApp();
  }catch(e){alert('Login error: '+(e?.message||e))}
  finally{btn.disabled=false;btn.textContent='Login'}
}
async function init(){
  const s=await db.auth.getSession();
  if(s.data&&s.data.session)showApp();
}
function showApp(){
  document.getElementById("login").style.display="none";
  document.getElementById("app").style.display="block";
  document.getElementById("logoutBtn").style.display="block";
  load();
}
async function logout(){
  await db.auth.signOut();
  location.reload();
}async function load(){let m=await db.from("menu_items").select("*").order("created_at");if(m.error){alert(m.error.message);return}list.innerHTML=(m.data||[]).map(x=>`<div class="row"><input value="${esc(x.name)}" onchange="edit('${x.id}','name',this.value)"><input type="number" value="${x.price}" onchange="edit('${x.id}','price',this.value)"><input value="${esc(x.image_url||"")}" placeholder="Image URL" onchange="edit('${x.id}','image_url',this.value)"><button onclick="toggle('${x.id}',${x.available})">${x.available?'Available':'Hidden'}</button><button class="danger" onclick="del('${x.id}')">Delete</button></div>`).join("")||"No menu items.";let s=await db.from("site_settings").select("*").eq("id",1).maybeSingle();mapurl.value=s.data?.map_url||"";let o=await db.from("orders").select("*").order("created_at",{ascending:false}).limit(50);if(o.error){orders.innerHTML=o.error.message;return}orders.innerHTML=(o.data||[]).map(x=>{let it=x.items||{};let cart=Array.isArray(it)?it:(it.cart||[]);let status=Array.isArray(it)?'Pending':(it.status||'Pending');let note=Array.isArray(it)?'':(it.delivery_instructions||'');let pay=Array.isArray(it)?'':(it.payment_method||'');let items=cart.map(a=>`${esc(a.name)} × ${a.qty||1}`).join(', ');return `<div class="order"><b>Order:</b> ${esc(x.id)}<br><b>${esc(x.customer_name)}</b> • ${esc(x.phone)}<br>📍 ${esc(x.address)}<br>🍽️ ${items}<br>💰 ${money(x.total)} • 💳 ${esc(pay||'Not specified')}<br>📝 ${esc(note||'None')}<br><br><select class="status" onchange="setStatus('${x.id}',this.value)"><option ${status==='Pending'?'selected':''}>Pending</option><option ${status==='Confirmed'?'selected':''}>Confirmed</option><option ${status==='Delivered'?'selected':''}>Delivered</option></select> <button class="danger" onclick="deleteOrder('${x.id}')">Delete Order</button><div class="small">${new Date(x.created_at).toLocaleString('en-IN')}</div></div>`}).join("")||"No orders."}async function addItem(){if(!n.value.trim()||!p.value)return alert('Name and price required');let r=await db.from('menu_items').insert({name:n.value.trim(),price:Number(p.value),image_url:img.value.trim(),description:desc.value.trim(),available:true});if(r.error)alert(r.error.message);else{n.value='';p.value='';img.value='';desc.value='';load()}}async function edit(id,k,v){let o={};o[k]=k==='price'?Number(v):v;let r=await db.from('menu_items').update(o).eq('id',id);if(r.error)alert(r.error.message)}async function toggle(id,current){let r=await db.from('menu_items').update({available:!current}).eq('id',id);if(r.error)alert(r.error.message);else load()}async function del(id){if(!confirm('Delete this menu item?'))return;let r=await db.from('menu_items').delete().eq('id',id);if(r.error)alert(r.error.message);else load()}async function setStatus(id,status){let r=await db.from('orders').select('items').eq('id',id).single();if(r.error)return alert(r.error.message);let items=r.data.items||{};if(Array.isArray(items))items={cart:items,delivery_instructions:'',payment_method:'',status:status};else items={...items,status};let u=await db.from('orders').update({items}).eq('id',id);if(u.error)alert(u.error.message);else load()}async function deleteOrder(id){if(!confirm('Delete this order permanently?'))return;let r=await db.from('orders').delete().eq('id',id);if(r.error)alert(r.error.message);else load()}async function saveMap(){let r=await db.from('site_settings').upsert({id:1,map_url:mapurl.value.trim()});if(r.error)alert(r.error.message);else alert('Google Maps link saved.')}init();</script></body></html>
