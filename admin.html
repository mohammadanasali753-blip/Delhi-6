<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Delhi 6 Hotel Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>body{margin:0;font-family:Arial;background:#fffaf0;color:#171717}header{background:#f4c400;padding:20px 6%;font-size:24px;font-weight:900}.wrap{max-width:1000px;margin:auto;padding:30px 6%}.panel{background:#fff;padding:22px;border-radius:16px;box-shadow:0 3px 15px #0002;margin-bottom:20px}input,textarea{width:100%;padding:12px;margin:7px 0;border:1px solid #ccc;border-radius:8px;box-sizing:border-box}button{padding:11px 17px;border:0;border-radius:9px;background:#f4c400;font-weight:900;cursor:pointer}.danger{background:#171717;color:white}.row{display:grid;grid-template-columns:1fr 110px 1fr 90px;gap:8px;border-top:1px solid #ddd;padding:12px 0;align-items:center}@media(max-width:650px){.row{grid-template-columns:1fr}.row button{width:100%}}</style></head>
<body><header>🔐 Delhi 6 Hotel — Admin</header><div class="wrap">
<div id="login" class="panel"><h2>Admin Login</h2><input id="email" placeholder="Admin email"><input id="password" type="password" placeholder="Password"><button onclick="login()">Login</button><p>Use the admin account you create in Supabase Authentication.</p></div>
<div id="app" style="display:none"><div class="panel"><h2>Hotel / Google Maps</h2><input id="mapurl" placeholder="Paste Google Maps URL"><button onclick="saveMap()">Save</button><p style="font-size:13px;color:#666">Google Maps link yahan paste karke Save karo. Customer website par button automatically update hoga.</p></div>
<div class="panel"><h2>Add Biryani</h2><input id="n" placeholder="Name"><input id="p" type="number" placeholder="Price ₹"><input id="img" placeholder="Image URL"><textarea id="desc" placeholder="Description"></textarea><button onclick="addItem()">Add Item</button></div>
<div class="panel"><h2>Menu</h2><div id="list"></div></div>
<div class="panel"><h2>Orders</h2><div id="orders">Loading...</div></div></div></div>
<script>
const SB_URL="https://qxktximeddpttcjkaumo.supabase.co",SB_KEY="sb_publishable_mUL6OaOwJ649Xi68uQOcLw_9g0fM8mM";const db=supabase.createClient(SB_URL,SB_KEY);
async function login(){let {error}=await db.auth.signInWithPassword({email:email.value,password:password.value});if(error)alert(error.message);else{login.style.display="none";app.style.display="block";load()}}
async function load(){let {data}=await db.from("menu_items").select("*").order("created_at");list.innerHTML=(data||[]).map(x=>`<div class="row" style="grid-template-columns:1fr 100px 1fr 100px 100px"><input value="${x.name}" onchange="edit('${x.id}','name',this.value)"><input type="number" value="${x.price}" onchange="edit('${x.id}','price',this.value)"><input value="${x.image_url||''}" placeholder="Image URL" onchange="edit('${x.id}','image_url',this.value)"><button onclick="toggle('${x.id}',${x.available})">${x.available?'Available':'Hidden'}</button><button class="danger" onclick="del('${x.id}')">Delete</button></div>`).join("");let s=await db.from("site_settings").select("*").eq("id",1).maybeSingle();mapurl.value=s.data?.map_url||"";let o=await db.from("orders").select("*").order("created_at",{ascending:false}).limit(30);orders.innerHTML=(o.data||[]).map(x=>`<p><b>${x.customer_name}</b> — ${x.phone} — ₹${x.total}<br>${x.items}<br>${x.address}</p><hr>`).join("")||"No orders."}
async function addItem(){let {error}=await db.from("menu_items").insert({name:n.value,price:Number(p.value),image_url:img.value,description:desc.value,available:true});if(error)alert(error.message);else{n.value=p.value=img.value=desc.value="";load()}}
async function edit(id,k,v){let o={};o[k]=k==="price"?Number(v):v;let {error}=await db.from("menu_items").update(o).eq("id",id);if(error)alert(error.message)}
async function toggle(id,current){let {error}=await db.from("menu_items").update({available:!current}).eq("id",id);if(error)alert(error.message);else load()}
async function del(id){if(confirm("Delete item?")){await db.from("menu_items").delete().eq("id",id);load()}}
async function saveMap(){let {error}=await db.from("site_settings").upsert({id:1,map_url:mapurl.value});if(error)alert(error.message);else alert("Saved")}
</script></body></html>
