<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Delhi 6 — Delivery Boy</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#fffaf0;color:#171717}.head{background:#f4c400;padding:16px 5%;font-size:21px;font-weight:900;display:flex;justify-content:space-between;align-items:center}.wrap{max-width:900px;margin:auto;padding:20px 5%}.card{background:#fff;border-radius:18px;padding:18px;margin-bottom:16px;box-shadow:0 4px 18px #0002}input,select{width:100%;padding:12px;margin:6px 0;border:1px solid #ccc;border-radius:9px;font:inherit}button{padding:11px 15px;border:0;border-radius:9px;background:#f4c400;font-weight:900;cursor:pointer}.dark{background:#171717;color:#fff}.danger{background:#b00020;color:#fff}.muted{color:#666;font-size:13px}.order{border:1px solid #ddd;border-radius:14px;padding:14px;margin:10px 0}.pill{display:inline-block;padding:5px 8px;border-radius:20px;background:#eee;font-size:12px;font-weight:800}.login{max-width:450px;margin:60px auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:650px){.grid{grid-template-columns:1fr}}.loc{background:#eaf6ff;padding:10px;border-radius:10px;margin:8px 0}.success{color:#087a2f;font-weight:800}.error{color:#b00020;font-weight:800}</style></head><body><header class="head"><span>🚚 Delhi 6 — Delivery Boy</span><button id="logout" class="dark" onclick="logout()" style="display:none">Logout</button></header><main class="wrap"><section id="login" class="card login"><h2>🚚 Delivery Boy Login</h2><p class="muted">Admin se mila Login ID aur PIN enter karo.</p><input id="loginId" placeholder="Login ID" autocomplete="username"><input id="pin" type="password" inputmode="numeric" maxlength="8" placeholder="4-8 digit PIN" autocomplete="current-password"><button style="width:100%;margin-top:8px" onclick="login()">Login</button><p id="loginMsg" class="error"></p></section><section id="panel" style="display:none"><div class="card"><div class="grid"><div><b id="boyName">Delivery Boy</b><div class="muted" id="boyPhone"></div></div><div><b>💰 Payment / Delivery</b><div id="boyPay">₹0</div></div></div></div><div class="card"><h2>📦 New Deliveries</h2><p class="muted">Jo order pehle accept karega, order usi ko milega.</p><div id="available">Loading...</div></div><div class="card"><h2>🚚 My Deliveries</h2><div id="mine">Loading...</div></div></section></main><script>const SB_URL='https://qxktximeddpttcjkaumo.supabase.co',SB_KEY='sb_publishable_mUL6OaOwJ649Xi68uQOcLw_9g0fM8mM',db=supabase.createClient(SB_URL,SB_KEY);let boy=null;function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function money(n){return '₹'+Number(n||0).toLocaleString('en-IN')}function login(){const id=document.getElementById('loginId').value.trim(),pin=document.getElementById('pin').value.trim(),msg=document.getElementById('loginMsg');if(!id||!/^[0-9]{4,8}$/.test(pin)){msg.textContent='Login ID aur 4-8 digit PIN bharo.';return}db.rpc('delivery_login',{p_login_id:id,p_pin:pin}).then(r=>{if(r.error){msg.textContent=r.error.message;return}if(!r.data?.length){msg.textContent='Wrong Login ID/PIN ya account inactive hai.';return}boy=r.data[0];localStorage.setItem('delhi6_delivery_boy',JSON.stringify(boy));showPanel();loadAll()})}function showPanel(){document.getElementById('login').style.display='none';document.getElementById('panel').style.display='block';document.getElementById('logout').style.display='block';document.getElementById('boyName').textContent='👤 '+boy.name;document.getElementById('boyPhone').textContent=boy.phone||'';document.getElementById('boyPay').textContent=money(boy.pay_per_order)}function logout(){localStorage.removeItem('delhi6_delivery_boy');location.reload()}async function loadAvailable(){const box=document.getElementById('available');const r=await db.rpc('delivery_available_orders',{p_delivery_boy_id:boy.id});if(r.error){box.innerHTML='<p class="error">'+esc(r.error.message)+'</p>';return}box.innerHTML=(r.data||[]).map(o=>`<div class="order"><b>📦 Order ${esc(o.order_id)}</b> <span class="pill">${esc(o.status)}</span><br>👤 ${esc(o.customer_name||'Customer')}<br>💰 Delivery Payment: <b>${money(o.payment)}</b><br><span class="muted">${new Date(o.created_at).toLocaleString('en-IN')}</span><br><button style="margin-top:9px" onclick="acceptOrder('${esc(o.order_id)}')">✅ Accept Delivery</button></div>`).join('')||'<p class="muted">No new delivery available.</p>'}async function acceptOrder(id){if(!confirm('Ye order accept karna hai?'))return;const r=await db.rpc('delivery_accept_order',{p_delivery_boy_id:boy.id,p_order_id:id});if(r.error){alert(r.error.message);loadAvailable();return}const o=r.data;alert('✅ Order accepted! Ab customer ki location aapko dikh rahi hai.');loadAvailable();loadMine()}async function loadMine(){const box=document.getElementById('mine');const r=await db.rpc('delivery_my_orders',{p_delivery_boy_id:boy.id});if(r.error){box.innerHTML='<p class="error">'+esc(r.error.message)+'</p>';return}box.innerHTML=(r.data||[]).map(o=>{const map=(o.address||'').match(/https?:\/\/[^\s]+/i)?.[0]||'';return `<div class="order"><b>📦 Order ${esc(o.order_id)}</b> <span class="pill">${esc(o.status)}</span><br>👤 ${esc(o.customer_name)}<br>📞 <a href="tel:${esc(o.phone)}">${esc(o.phone)}</a><br>📍 <b>Customer Address</b><div class="loc">${esc(o.address||'')}</div><div class="grid"><div><b>Order Total</b><br>${money(o.total)}</div><div><b>Your Payment</b><br>${money(o.payment)}</div></div>${map?`<p><a href="${esc(map)}" target="_blank"><button>🗺️ Open Customer Location</button></a></p>`:''}<p><a href="tel:${esc(o.phone)}"><button>📞 Call Customer</button></a></p><select id="st_${esc(o.order_id)}"><option>Assigned</option><option>Picked Up</option><option>Out for Delivery</option><option>Delivered</option><option>Cancelled</option></select><button onclick="updateStatus('${esc(o.order_id)}')">💾 Update Status</button></div>`}).join('')||'<p class="muted">No assigned deliveries.</p>'}async function updateStatus(id){const st=document.getElementById('st_'+id).value;const r=await db.rpc('delivery_update_status',{p_delivery_boy_id:boy.id,p_order_id:id,p_status:st});if(r.error){alert(r.error.message);return}loadMine();loadAvailable()}function sendLocation(){if(!navigator.geolocation)return; navigator.geolocation.getCurrentPosition(async p=>{await db.rpc('delivery_update_location',{p_delivery_boy_id:boy.id,p_lat:p.coords.latitude,p_lng:p.coords.longitude,p_accuracy:p.coords.accuracy||null})})}async function loadAll(){await Promise.all([loadAvailable(),loadMine()]);sendLocation()}const saved=localStorage.getItem('delhi6_delivery_boy');if(saved){try{boy=JSON.parse(saved);showPanel();loadAll()}catch(e){localStorage.removeItem('delhi6_delivery_boy')}}setInterval(()=>{if(boy){loadAvailable();loadMine();sendLocation()}},10000);</script></body></html>
